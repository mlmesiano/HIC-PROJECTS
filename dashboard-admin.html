<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELTECH Library - Admin Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
<style>
  .restock-dialog {
    width: min(440px, calc(100% - 32px));
    max-width: none;
    max-height: calc(100% - 32px);
    margin: auto;
    padding: 0;
    overflow: auto;
    background: #ffffff;
    border: 0;
    border-radius: 12px;
    color: var(--text);
    box-shadow: 0 18px 55px rgba(0, 0, 0, 0.25);
  }

  .restock-dialog::backdrop {
    background: rgba(8, 39, 19, 0.58);
    backdrop-filter: blur(2px);
  }

  .restock-dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 22px;
    background: var(--green-dark);
    color: var(--white);
  }

  .restock-dialog-header h2 {
    font-size: 18px;
  }

  .restock-dialog-close {
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 50%;
    background: transparent;
    color: var(--white);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .restock-dialog-close:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .restock-dialog-body {
    padding: 22px;
  }

  .restock-book-title {
    margin-bottom: 14px;
    color: var(--green-dark);
    font-size: 16px;
    font-weight: 700;
  }

  .restock-stock-details {
    display: grid;
    gap: 9px;
    margin: 0 0 20px;
  }

  .restock-stock-details div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: #555555;
    font-size: 13px;
  }

  .restock-stock-details dt,
  .restock-stock-details dd {
    margin: 0;
  }

  .restock-stock-details dd {
    color: var(--text);
    font-weight: 700;
    text-align: right;
  }

  .restock-quantity-label {
    display: block;
    margin-bottom: 7px;
    color: var(--green-dark);
    font-size: 13px;
    font-weight: 700;
  }

  .restock-quantity-input {
    width: 100%;
    padding: 11px 12px;
    border: 2px solid var(--green-mid);
    border-radius: 6px;
    color: #000000;
    font-size: 14px;
  }

  .restock-quantity-input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.14);
  }

  .restock-validation {
    min-height: 18px;
    margin-top: 6px;
    color: var(--red);
    font-size: 12px;
  }

  .restock-dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .restock-dialog-actions .btn {
    width: auto;
    min-width: 116px;
    margin: 0;
  }

  .restock-dialog-actions .btn.cancel {
    border-color: var(--green-mid);
    color: var(--green-dark);
  }

  .restock-toast {
    position: fixed;
    right: 20px;
    bottom: 46px;
    z-index: 1001;
    max-width: min(420px, calc(100vw - 40px));
    padding: 12px 16px;
    border: 1px solid var(--green);
    border-radius: 8px;
    background: var(--green-dark);
    color: var(--white);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    font-size: 13px;
  }

  .restock-toast[hidden] {
    display: none;
  }

  @media (max-width: 480px) {
    .restock-dialog-header,
    .restock-dialog-body {
      padding: 16px;
    }

    .restock-dialog-actions {
      flex-direction: column-reverse;
    }

    .restock-dialog-actions .btn {
      width: 100%;
    }

    .restock-toast {
      right: 12px;
      bottom: 40px;
      max-width: calc(100vw - 24px);
    }
  }
</style>
</head>
<body>
<div class="titlebar">
  <img src="images.jpg" alt="CELTECH College Olongapo logo">
  <div><b> CELTECH COLLEGE OLONGAPO — Digital Library</b> | BSIT 3A Final Project</div>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Navigation</h3>
    <div id="nav-books" class="nav-item active" onclick="showView('books')">📖 CELTECH Books</div>
    <div id="nav-requests" class="nav-item" onclick="showView('requests')">📋 Student / Teacher Requests</div>
    <div id="nav-about" class="nav-item" onclick="showView('about')">🏫 About Library</div>

    <div class="admin-profile-section">
      <h3>Admin Info</h3>
      <div class="profile">
        <small>ADMIN NAME</small><p id="pName">-</p>
        <small>ROLE</small><p id="pRole" style="margin-bottom:0">Administrator</p>
        <button class="btn logout" onclick="doLogout()">LOG OUT</button>
      </div>
    </div>
  </div>

  <div class="editor">
    <div class="content" id="content"></div>
  </div>
</div>

<div class="statusbar">
  <span id="statusUser">Not logged in</span>
  <span id="statusMsg">| Ready</span>
  <span style="margin-left:auto">CELTECH All Green Theme | Admin</span>
</div>

<dialog id="restockDialog" class="restock-dialog" aria-labelledby="restockTitle">
  <form id="restockForm" novalidate>
    <div class="restock-dialog-header">
      <h2 id="restockTitle">Restock Book</h2>
      <button class="restock-dialog-close" type="button" aria-label="Close restock dialog"
        onclick="closeRestockDialog()">&times;</button>
    </div>
    <div class="restock-dialog-body">
      <p id="restockBookTitle" class="restock-book-title"></p>
      <dl class="restock-stock-details">
        <div><dt>Current Stock</dt><dd id="restockCurrentStock"></dd></div>
        <div><dt>Available Stock</dt><dd id="restockAvailableStock"></dd></div>
        <div><dt>Reserved</dt><dd id="restockReservedStock"></dd></div>
      </dl>
      <label class="restock-quantity-label" for="restockQuantity">Quantity to Add</label>
      <input id="restockQuantity" class="restock-quantity-input" type="number" min="1" step="1"
        inputmode="numeric" aria-describedby="restockValidation">
      <p id="restockValidation" class="restock-validation" aria-live="polite"></p>
      <div class="restock-dialog-actions">
        <button class="btn cancel" type="button" onclick="closeRestockDialog()">Cancel</button>
        <button class="btn" type="submit">Confirm Restock</button>
      </div>
    </div>
  </form>
</dialog>
<div id="restockToast" class="restock-toast" role="status" aria-live="polite" hidden></div>

<script src="books-data.js"></script>
<script src="library-storage.js"></script>
<script>
let currentView = 'books';
let currentCategory = 'All';
let searchText = '';
let restockBookId = null;
let restockToastTimeout;
const categories = ['All', 'BSIT Major', 'GenEd', 'Thesis'];

function updateProfile() {
  const user = getCurrentUser();
  const name = String(user.name || 'Administrator');
  document.getElementById('pName').textContent = name;
  document.getElementById('statusUser').textContent = `👤 ${name} (Administrator)`;
}

function doLogout() {
  if (confirm('Log out?')) {
    localStorage.removeItem('celtech_user');
    window.location.href = 'index.php';
  }
}

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  document.getElementById(`nav-${view}`).classList.add('active');
  render();
}

function filterCategory(category) {
  currentCategory = category;
  render();
}

function renderBooks(content) {
  const query = searchText.toLowerCase();
  const filtered = books.filter(book =>
    (currentCategory === 'All' || book.category === currentCategory) &&
    (!query || book.title.toLowerCase().includes(query) || book.author.toLowerCase().includes(query))
  );

  content.innerHTML = `
    <h3 style="color:#0a5e28">CELTECH Library Catalog — ${filtered.length} Books</h3>
    <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">
      ${categories.map(category => `
        <button class="category-filter" type="button" aria-pressed="${currentCategory === category}"
          onclick="filterCategory('${category}')">${category}</button>
      `).join('')}
    </div>
    <input id="searchInput" class="search" value="${escapeHtml(searchText)}"
      placeholder="Search CELTECH Books..." oninput="searchText=this.value;render()">
    <div class="book-grid">
      ${filtered.map(book => {
        const reserved = getBookReservationCount(book.id);
        const available = getAvailableCopies(book.id);
        return `
          <div class="book">
            <h4>${escapeHtml(book.title)}</h4>
            <div class="meta">Author: ${escapeHtml(book.author)} | Shelf: ${escapeHtml(book.shelf)}</div>
            <div class="meta">Category: ${escapeHtml(book.category)}</div>
            <div class="meta">Total Copies: ${book.copies}</div>
            <div class="meta">Available: ${available}</div>
            <div class="meta">Reserved: ${reserved}</div>
            <button class="btn" type="button" data-restock-book-id="${book.id}"
              onclick="restock(${book.id})">RESTOCK</button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function restock(bookId) {
  refreshLibraryData();
  const book = books.find(item => item.id === Number(bookId));
  if (!book) {
    showRestockToast('Book not found.');
    return;
  }

  restockBookId = book.id;
  document.getElementById('restockBookTitle').textContent = book.title;
  document.getElementById('restockCurrentStock').textContent = `${book.copies} Copies`;
  document.getElementById('restockAvailableStock').textContent = `${getAvailableCopies(book.id)} Copies`;
  document.getElementById('restockReservedStock').textContent = `${getBookReservationCount(book.id)} Copies`;
  const quantityInput = document.getElementById('restockQuantity');
  quantityInput.value = '';
  quantityInput.removeAttribute('aria-invalid');
  document.getElementById('restockValidation').textContent = '';
  document.getElementById('restockDialog').showModal();
  document.getElementById('restockQuantity').focus();
}

function closeRestockDialog() {
  document.getElementById('restockDialog').close();
}

function showRestockToast(message) {
  const toast = document.getElementById('restockToast');
  toast.textContent = message;
  toast.hidden = false;
  window.clearTimeout(restockToastTimeout);
  restockToastTimeout = window.setTimeout(() => { toast.hidden = true; }, 3500);
}

function submitRestock(event) {
  event.preventDefault();
  const quantityInput = document.getElementById('restockQuantity');
  const quantity = quantityInput.valueAsNumber;
  const validation = document.getElementById('restockValidation');
  if (!Number.isSafeInteger(quantity) || quantity <= 0) {
    validation.textContent = 'Enter a positive whole-number quantity.';
    quantityInput.setAttribute('aria-invalid', 'true');
    quantityInput.focus();
    return;
  }

  try {
    const updatedBook = addBookStock(restockBookId, quantity);
    document.getElementById('statusMsg').textContent = '| Stock updated';
    render();
    closeRestockDialog();
    showRestockToast(`${updatedBook.title} restocked successfully. Updated total stock: ${updatedBook.copies}.`);
  } catch (error) {
    validation.textContent = error.message;
    quantityInput.setAttribute('aria-invalid', 'true');
    quantityInput.focus();
  }
}

document.getElementById('restockForm').addEventListener('submit', submitRestock);
document.getElementById('restockQuantity').addEventListener('input', event => {
  event.currentTarget.removeAttribute('aria-invalid');
  document.getElementById('restockValidation').textContent = '';
});
document.getElementById('restockDialog').addEventListener('click', event => {
  if (event.target === event.currentTarget) closeRestockDialog();
});
document.getElementById('restockDialog').addEventListener('close', () => {
  const restockButton = document.querySelector(`[data-restock-book-id="${restockBookId}"]`);
  if (restockButton) restockButton.focus();
  restockBookId = null;
});

function renderRequests(content) {
  content.innerHTML = `
    <h3 style="color:#0a5e28">Student / Teacher Requests — ${reservations.length} Active</h3>
    ${reservations.length === 0
      ? '<p style="color:#888;margin-top:20px">No active reservations.</p>'
      : `
        <div class="request-table-wrap">
          <table class="request-table">
            <thead>
              <tr>
                <th>Student/Teacher Name</th>
                <th>User ID</th>
                <th>Role</th>
                <th>Book Title</th>
                <th>Reservation Date</th>
                <th>Book Shelf</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${reservations.map(reservation => {
                const book = books.find(item => item.id === reservation.bookId);
                return `
                  <tr>
                    <td>${escapeHtml(reservation.userName)}</td>
                    <td>${escapeHtml(reservation.userId || '—')}</td>
                    <td>${escapeHtml(reservation.userRole)}</td>
                    <td>${escapeHtml(book ? book.title : reservation.title || 'Unknown book')}</td>
                    <td>${escapeHtml(reservation.date)}</td>
                    <td>${escapeHtml(book ? book.shelf : reservation.shelf || '—')}</td>
                    <td>${escapeHtml(reservation.status)}</td>
                    <td><button class="btn cancel" type="button"
                      data-reservation-id="${escapeHtml(reservation.reservationId)}"
                      onclick="cancelRequest(this.dataset.reservationId)">Cancel</button></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
  `;
}

function cancelRequest(reservationId) {
  if (!confirm('Cancel this reservation?')) return;
  if (!cancelReservation(reservationId)) {
    alert('Reservation could not be cancelled.');
    return;
  }
  document.getElementById('statusMsg').textContent = '| Reservation cancelled';
  render();
}

function renderAbout(content) {
  content.innerHTML = `
    <h3 style="color:#0a5e28">🏫 About CELTECH Library</h3>
    <div style="margin-top:15px;line-height:1.8;font-size:13px;background:#fff;padding:18px;border-radius:8px;border:2px solid #0e8a3a">
      <b>School:</b> Celtech College Olongapo (All Green)<br>
      <b>Project:</b> Digital Library Reservation System<br>
      <b>Course:</b> BSIT 3A<br>
      <b>ID Format:</b> 9 digits — Example 202411059<br>
      <b>Theme:</b> CELTECH Green & White<br><br>
      <span style="color:#0e8a3a;font-weight:bold">
        Features: Login, book inventory management, and reservation monitoring.
      </span><br><br>
      <span style="color:#888">// Student project — BSIT Final</span>
    </div>
  `;
}

function render() {
  refreshLibraryData();
  const content = document.getElementById('content');
  if (currentView === 'books') renderBooks(content);
  else if (currentView === 'requests') renderRequests(content);
  else renderAbout(content);
}

if (requireDashboardRole('admin')) {
  updateProfile();
  render();
}
</script>
</body>
</html>
