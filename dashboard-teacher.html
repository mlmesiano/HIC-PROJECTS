<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELTECH Library - BSIT Project</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>


<div class="titlebar">
  <img src="images.jpg" alt="CELTECH College Olongapo logo">
  <div><b> CELTECH COLLEGE OLONGAPO — Digital Library</b> | BSIT 3A Final Project</div>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Navigation</h3>
    <div id="nav-books" class="nav-item active" onclick="showView('books')">📖 CELTECH Books</div>
    <div id="nav-my" class="nav-item" onclick="showView('my')">🔖 My Reservations</div>
    <div id="nav-about" class="nav-item" onclick="showView('about')">🏫 About Library</div>

   <h3 id="pHeading">Student Info</h3>
<div class="profile">
  <small id="pLabel">STUDENT NAME</small><p id="pName">-</p>
  <small>ROLE</small><p id="pRole" style="margin-bottom:0">-</p>
  <button class="btn logout" onclick="doLogout()">LOG OUT</button>
</div>

  </div>

  <div class="editor">
    <div class="content" id="content"></div>
  </div>
</div>

<div class="statusbar">
  <span id="statusUser">Not logged in</span><span id="statusMsg">| Ready</span><span style="margin-left:auto">CELTECH All Green Theme | ID: 202411059 format</span>
</div>

<script src="books-data.js"></script>
<script src="library-storage.js"></script>
<script src="library-ui.js"></script>
<script>
  

let currentView='books'; let currentCat='All'; let currentSearch='';
const categories=['All','BSIT Major','GenEd','Thesis'];


function updateProfile(){
  const u = getCurrentUser();

  const role  = u.role || 'student';
  const label = role.charAt(0).toUpperCase() + role.slice(1);                 // "Student" / "Teacher" / "Admin"
  const name  = u.name.charAt(0).toUpperCase() + u.name.slice(1).toLowerCase();

  document.getElementById('pHeading').textContent = label + ' Info';          // Student Info / Teacher Info
  document.getElementById('pLabel').textContent   = label.toUpperCase() + ' NAME';
  document.getElementById('pName').textContent    = name;
  document.getElementById('pRole').textContent    = label;
  document.getElementById('statusUser').textContent = `👤 ${name} (${label})`;
}

function doLogout(){
  if(confirm('Log out?')){
    localStorage.removeItem('celtech_user');
    window.location.href = 'index.php';
  }
}
function showView(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.querySelectorAll('.activity div').forEach((d,i)=>{d.classList.toggle('active',(v==='books'&&i===0)||(v==='my'&&i===1)||(v==='about'&&i===2))});
  render();
}
function filterCat(c){currentCat=c;render();}

function render() {
  refreshLibraryData();
  const content = document.getElementById('content');

  if (currentView === 'books') {
    let filtered = currentCat === 'All'
      ? books
      : books.filter(b => b.category === currentCat);

    const s = currentSearch.toLowerCase();

    if (s) {
      filtered = filtered.filter(b => b.title.toLowerCase().includes(s));
    }

    content.innerHTML = `
      <h3 style="color:#0a5e28"> CELTECH Library Catalog — ${filtered.length} Books</h3>

      <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">
        ${categories.map(c => `
          <span onclick="filterCat('${c}')"
            style="padding:6px 14px;border:2px solid ${currentCat === c ? '#0e8a3a' : '#c8e6c9'};border-radius:20px;font-size:11px;cursor:pointer;background:${currentCat === c ? '#0e8a3a' : '#fff'};color:${currentCat === c ? '#fff' : '#0a5e28'};font-weight:bold">
            ${c}
          </span>
        `).join('')}
      </div>

      <input id="searchInput" class="search"
        value="${escapeHtml(currentSearch)}"
        placeholder="Search CELTECH Books..."
        oninput="updateCatalogSearch(this)">

      <div class="book-grid">
        ${filtered.map(b => {
          const user = getCurrentUser();
          const available = getAvailableCopies(b.id);
          const myRequest = getUserActiveReservations(user).find(r => r.bookId === b.id);

          const disabled = available <= 0 || Boolean(myRequest) || getUserActiveReservations(user).length >= 3;

          return `
            <div class="book">
              <h4>${escapeHtml(b.title)}</h4>
              <div class="meta">Author: ${escapeHtml(b.author)} | Shelf: ${escapeHtml(b.shelf)}</div>
              <div class="meta">${escapeHtml(b.category)} | Copies: ${b.copies}</div>
              <span class="status ${available > 0 ? 'available' : 'reserved'}">
                ${available > 0 ? available + ' available' : 'OUT OF STOCK'}
              </span>
              <button class="btn" ${disabled ? 'disabled' : ''}
                onclick="reserve(${b.id})">
                ${myRequest ? escapeHtml(myRequest.status) : available <= 0 ? 'Not Available' : 'Reserve Now'}
              </button>
            </div>
          `;
        }).join('')}
      </div>
    `;

  } else if (currentView === 'my') {
    const u = getCurrentUser();
    const userReservations = getUserReservations(u);
    const userId = u.id || 'Not provided';

    content.innerHTML = `
      <h3 style="color:#0a5e28">📖 My Reservations — ID: ${escapeHtml(userId)}</h3>
      <div class="library-reminder"><strong>PLEASE RETURN YOUR BORROWED BOOK</strong><br>
        Please return borrowed books on or before the assigned due date. Failure to return borrowed books may result in a library penalty.</div>

      ${userReservations.length === 0
        ? '<p style="color:#888;margin-top:20px">No reservations or borrowing history yet. Go to CELTECH Books to request a book.</p>'
        : userReservations.map(r => {
            return `
              <div class="res-item">
                <div>
                  <b>${escapeHtml(r.title)}</b>
                  <span class="reservation-status ${r.status === OVERDUE_STATUS ? 'overdue' : r.status === DECLINED_STATUS || r.status === CANCELLED_STATUS ? 'declined' : ''}">${escapeHtml(r.status)}</span>
                  <span style="background:#0e8a3a;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">${escapeHtml(r.shelf)}</span>
                  <div class="meta">Reservation #: ${escapeHtml(r.reservationId)}</div>
                  <div class="meta">Author: ${escapeHtml(r.author)} | Category: ${escapeHtml(r.category)}</div>
                  <div class="meta">Request date: ${formatManilaDateTime(r.requestCreatedAt)}</div>
                  <div class="meta">Preferred pickup: ${formatManilaDateTime(r.preferredPickupAt)}</div>
                  ${r.confirmedPickupAt ? `<div class="meta">Confirmed pickup: ${formatManilaDateTime(r.confirmedPickupAt)}</div>` : ''}
                  ${r.pickedUpAt ? `<div class="meta">Picked up: ${formatManilaDateTime(r.pickedUpAt)}</div>` : ''}
                  ${r.dueAt ? `<div class="meta">Return due: ${formatManilaDateTime(r.dueAt)}</div>` : ''}
                  ${r.dueAt && HELD_STATUSES.has(r.status) ? `<div class="meta">Remaining: <span data-countdown="${escapeHtml(r.dueAt)}">${formatRemainingTime(r.dueAt)}</span></div>` : ''}
                  ${r.returnedAt ? `<div class="meta">Returned: ${formatManilaDateTime(r.returnedAt)}</div>` : ''}
                  ${r.declineReason ? `<div class="meta">Decline reason: ${escapeHtml(r.declineReason)}</div>` : ''}
                  ${r.penaltyStatus !== 'No Penalty' ? `<div class="reservation-warning">Penalty status: ${escapeHtml(r.penaltyStatus)}. DEMO PLACEHOLDER penalty amount: ₱${Number(r.penaltyAmount ?? getPenaltyAmount()).toLocaleString('en-PH')}.</div>` : ''}
                  ${r.status === DUE_SOON_STATUS ? `<div class="reservation-warning">Due soon: ${getDueSoonThresholdHours()} hours or less remain. Please return the book to the library.</div>` : ''}
                  ${r.status === OVERDUE_STATUS ? `<div class="reservation-warning">Overdue by ${formatRemainingTime(r.dueAt)}. DEMO PLACEHOLDER penalty notice: ₱${Number(r.penaltyAmount ?? getPenaltyAmount()).toLocaleString('en-PH')}. This is not an enforceable school fee.</div>` : ''}
                  ${[BORROWED_STATUS, DUE_SOON_STATUS, OVERDUE_STATUS].includes(r.status) ? '<div class="meta">Return the physical book to the library. Only an Admin can confirm its return.</div>' : ''}
                </div>
                ${[PENDING_STATUS, APPROVED_STATUS].includes(r.status) && !r.pickedUpAt
                  ? `<button class="btn cancel" style="width:auto" data-reservation-id="${escapeHtml(r.reservationId)}" onclick="cancel(this.dataset.reservationId)">Cancel Request</button>`
                  : ''}
              </div>
            `;
          }).join('')
      }
    `;

  } else {
    content.innerHTML = `
      <h3 style="color:#0a5e28">🏫 About CELTECH Library</h3>
      <div style="margin-top:15px;line-height:1.8;font-size:13px;background:#fff;padding:18px;border-radius:8px;border:2px solid #0e8a3a">
        <b>School:</b> Celtech College Olongapo (All Green)<br>
        <b>Project:</b> Digital Library Reservation System<br>
        <b>Course:</b> BSIT 3A<br>
        <b>ID Format:</b> 9 digits — Example 202411059<br>
        <b>Theme:</b> CELTECH Green & White<br><br>
        <span style="color:#0e8a3a;font-weight:bold">
          Features: Login, Reserve books, My Reservations.
        </span><br><br>
        <span style="color:#888">// Student project — BSIT Final</span>
      </div>
    `;
  }
}
function reserve(id) {
  const book = books.find(item => item.id === Number(id));
  if (!book) {
    showLibraryToast('Book not found.', 'error');
    return;
  }
  const user = getCurrentUser();
  const defaultPickup = getManilaDateTimeParts(new Date(Date.now() + 86400000));
  openLibraryDialog({
    title: 'Confirm Reservation',
    description: 'Choose your preferred pickup schedule. The request will remain pending until an administrator reviews it.',
    details: [
      { label: 'Book', value: book.title },
      { label: 'Author', value: book.author },
      { label: 'Shelf', value: book.shelf },
      { label: 'Category', value: book.category },
      { label: 'Name', value: user.name },
      { label: 'User ID', value: user.id || 'Not provided' },
      { label: 'Role', value: user.role }
    ],
    fields: [
      { name: 'pickupDate', label: 'Preferred pickup date (Asia/Manila)', type: 'date', min: getManilaDateTimeParts().date, value: defaultPickup.date, required: true },
      { name: 'pickupTime', label: 'Preferred pickup time (Asia/Manila)', type: 'time', value: defaultPickup.time, required: true }
    ],
    confirmText: 'Confirm Reservation',
    onConfirm(values) {
      const pickupAt = parseManilaDateTime(values.pickupDate, values.pickupTime);
      const reservation = reserveBook(book.id, user, pickupAt);
      render();
      showLibraryToast(`Request submitted. Reservation #${reservation.reservationId}`);
    }
  });
}

function updateCatalogSearch(input) {
  currentSearch = input.value;
  const cursor = input.selectionStart;
  render();
  const updatedInput = document.getElementById('searchInput');
  updatedInput.focus();
  updatedInput.setSelectionRange(cursor, cursor);
}

function cancel(reservationId) {
  const reservation = getReservation(reservationId);
  if (!reservation || ![PENDING_STATUS, APPROVED_STATUS].includes(reservation.status) || reservation.pickedUpAt) {
    showLibraryToast('This request can no longer be cancelled.', 'error');
    return;
  }
  openLibraryDialog({
    title: 'Cancel Reservation Request',
    description: `Cancel the request for “${reservation.title}”? This will release the held copy.`,
    confirmText: 'Cancel Request',
    onConfirm() {
      if (!cancelReservation(reservationId, getCurrentUser())) {
        throw new Error('This request can no longer be cancelled.');
      }
      render();
      showLibraryToast('Reservation request cancelled.');
    }
  });
}

function updateCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach(element => {
    element.textContent = formatRemainingTime(element.dataset.countdown);
  });
  refreshLibraryData();
  if (currentView === 'my') render();
}

if (requireDashboardRole('teacher')) {
  updateProfile();
  subscribeToLibraryUpdates(render);
  render();
  window.setInterval(updateCountdowns, 60000);
}
</script>
</body>
</html>
